<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  系统启动画面上的那一张静态图（冷启动设计稿 docs/design/cold-start）。
  画布 108 × 108，中间是 96 × 96、圆角 30 的实心方块 + 白色 wallet-outline（MDI，50 px）——方块与 Web 层加载页（boot.css 的 ft-boot__logo）的 Logo 同尺寸、同位置，
  系统启动画面 → 加载页之间 Logo 不动，只多长出文字与渐变。
  四周各留 6 的透明边是有意的：MAUI 在 Android 12+ 生成的启动图 drawable 把这张图固定拉成 108dp（Android 12 以下按原尺寸居中），
  画布正好 108 的话两种情况方块都是 96，没有尺寸跳变。csproj 里 BaseSize 同为 108,108。
  方块色 #7E3EFF = 令牌 ft-splash-tile（加载页深色玻璃方块压在渐变上的实测色）：静态图不能做模糊与半透明，只能用预合成的实色。
  底色（#5C2EF7 = 令牌 ft-splash-bg）不在这里，由 FinanceTracker.App.csproj 里 MauiSplashScreen 的 Color 提供。
  （XML 注释里不能出现连续两个连字符，所以令牌名这里不带前缀的两个短横线。）
  不放文字：Android 12+ 的系统启动画面会把图标裁进中心圆形遮罩。
  改色 / 改尺寸时一起改：tokens.css、csproj、MainPage.xaml——DesignTokensTests 校验取值一致。
-->
<svg width="108" height="108" viewBox="0 0 108 108" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <rect x="6" y="6" width="96" height="96" rx="30" ry="30" fill="#7E3EFF" />
    <g transform="translate(29 29) scale(2.083333)">
        <path fill="#FFFFFF" d="M5,3C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V16.72C21.59,16.37 22,15.74 22,15V9C22,8.26 21.59,7.63 21,7.28V5A2,2 0 0,0 19,3H5M5,5H19V7H13A2,2 0 0,0 11,9V15A2,2 0 0,0 13,17H19V19H5V5M13,9H20V15H13V9M16,10.5A1.5,1.5 0 0,0 14.5,12A1.5,1.5 0 0,0 16,13.5A1.5,1.5 0 0,0 17.5,12A1.5,1.5 0 0,0 16,10.5Z" />
    </g>
</svg>
