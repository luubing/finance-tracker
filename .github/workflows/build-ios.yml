name: Build iOS and Upload to Pgyer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: ''
      build_number:
        description: 'Build number (auto-increment if empty)'
        required: false
        default: ''

# 最小权限：本工作流只读代码，不需要任何写权限（不推送、不发布、不上传 artifact）
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/FinanceTracker.App/FinanceTracker.App.csproj'
  OUTPUT_PATH: 'build/output/ios'

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. 检出代码
      #   persist-credentials: false —— 后面的步骤会运行 NuGet 包带来的 MSBuild 任务，不要把 GITHUB_TOKEN 留在 .git/config 里
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 1.1 预检：缺少必需的 Secret / 变量时，在开始花钱的 macOS 构建之前就失败，并明确说缺哪个
      #   只打印名字，绝不打印值。云端地址是打包必填项（仓库不内置线上域名，见 README「构建与发布」）：
      #   读 Actions 的 Secret 或变量 CLOUD_API_BASE_URL（同名时 Secret 优先）；两种放法，构建日志里这个地址都会被遮成 ***（见下面的 add-mask）。
      #   蒲公英安装密码 PGYER_INSTALL_PASSWORD 是可选的（不设 = 公开安装，见上传步骤），不在必填之列。
      - name: Preflight - check required secrets and variables
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          CLOUD_API_BASE_URL: ${{ secrets.CLOUD_API_BASE_URL || vars.CLOUD_API_BASE_URL }}
        run: |
          # 变量（vars）不会被 GitHub 自动脱敏，而这个仓库是公开的、构建日志任何人都能读：
          # 先显式登记一次，之后每个步骤的日志里出现这个地址都会显示成 ***（放 Secret 时本来就脱敏，重复登记无害）
          if [ -n "${CLOUD_API_BASE_URL:-}" ]; then
            echo "::add-mask::$CLOUD_API_BASE_URL"
          fi

          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE \
                      APPLE_PROVISIONING_PROFILE_NAME PGYER_API_KEY CLOUD_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少必需的 Secret / 变量:$missing 。设置方法见 .github/SETUP-IOS-BUILD.md"
            exit 1
          fi

          # 云端地址的格式在这里先查一遍（App 项目文件发布时也会校验，这里省掉一次白跑的 macOS 构建）
          #   规则与 App 项目文件的 ValidateCloudApiBaseUrl、运行时的 CloudApiBaseUrlResolver 保持一致
          #   （CloudApiBaseUrlResolverTests 用同一批样例守着三处不漂移）；这里更严一点（不容忍首尾空白、协议须小写）
          url_pattern='^https?://(\[[0-9A-Fa-f:.]+\]|[^][/[:space:]?#@:]+)(:([0-9]{1,4}|[0-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(/[^[:space:]?#@]*)?$'
          if ! [[ "$CLOUD_API_BASE_URL" =~ $url_pattern ]]; then
            echo "::error::CLOUD_API_BASE_URL 必须是以小写 http:// 或 https:// 开头、带主机名的地址（首尾不能有空白，不能带用户名密码、查询参数；端口须是 0-65535 的数字）"
            exit 1
          fi
          echo "✅ 必需的 Secret / 变量都已配置"

      # 2. 安装 .NET SDK
      #   第三方 Action 一律固定到提交 SHA（行尾注释是对应的版本号）：标签可以被改指向别的提交，
      #   而这个工作流拿得到签名证书等 Secret，不能让标签被劫持后的代码跑在这里。升级交给 Dependabot。
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 2.1 确认实际用的是 .NET 10.0.x SDK
      #   runner 镜像（2026-11 起）的 /Users/runner/.dotnet 里同时预装了 .NET 11 SDK，`dotnet` 默认取最高版本：
      #   工作负载会装成 .NET 11 的清单（iOS 27.x / MAUI 11.0.0），net10.0-ios 只剩 Microsoft.iOS.Sdk.net10.0_26.0，
      #   Build iOS 于是要求 Xcode 26.0（镜像默认是 26.6；切到 26.0.1 又缺 iOS 26.0 模拟器运行时，actool 报
      #   "No simulator runtime version ... available to use with iphonesimulator SDK version 23A339"）。
      #   仓库根目录的 global.json（rollForward: latestFeature）把 SDK 锁在 10.0.x，这里只做校验：
      #   选错了就立刻失败，不要等到 Build iOS 才报一堆看不懂的 Xcode 版本错误。
      - name: Verify .NET SDK is 10.0.x
        run: |
          dotnet --list-sdks
          version="$(dotnet --version)"
          echo "dotnet $version"
          case "$version" in
            10.0.*) ;;
            *)
              echo "::error::期望 .NET 10.0.x SDK，实际是 $version（检查仓库根目录的 global.json）"
              exit 1
              ;;
          esac

      # 3. 安装 MAUI 工作负载
      #   即使锁定了 10.0.x SDK，不指定版本时 `dotnet workload install maui` 也会装最新的工作负载集
      #   （10.0.404 的 iOS 清单是 27.2，要求 Xcode 27.2，runner 上没有）。这里固定为 2026-09-11 最后一次成功构建
      #   用的工作负载集 10.0.401（iOS 26.5.10318 / MAUI 10.0.20 / Android 36.1.69 / emscripten、mono 10.0.112），
      #   逐项写成回滚文件，不依赖「版本号 → NuGet 包」的映射。
      #   以后要升级时：同时更新这里的清单版本和下一步的 Xcode 版本（包要求哪个 Xcode，构建报错里会写明）。
      - name: Install MAUI workload
        run: |
          cat > "$RUNNER_TEMP/workload-rollback.json" <<'EOF'
          {
            "microsoft.net.sdk.android": "36.1.69/10.0.100",
            "microsoft.net.sdk.ios": "26.5.10318/10.0.100",
            "microsoft.net.sdk.maccatalyst": "26.5.10318/10.0.100",
            "microsoft.net.sdk.macos": "26.5.10318/10.0.100",
            "microsoft.net.sdk.maui": "10.0.20/10.0.100",
            "microsoft.net.sdk.tvos": "26.5.10318/10.0.100",
            "microsoft.net.workload.emscripten.current": "10.0.112/10.0.100",
            "microsoft.net.workload.emscripten.net6": "10.0.112/10.0.100",
            "microsoft.net.workload.emscripten.net7": "10.0.112/10.0.100",
            "microsoft.net.workload.emscripten.net8": "10.0.112/10.0.100",
            "microsoft.net.workload.emscripten.net9": "10.0.112/10.0.100",
            "microsoft.net.workload.mono.toolchain.current": "10.0.112/10.0.100",
            "microsoft.net.workload.mono.toolchain.net6": "10.0.112/10.0.100",
            "microsoft.net.workload.mono.toolchain.net7": "10.0.112/10.0.100",
            "microsoft.net.workload.mono.toolchain.net8": "10.0.112/10.0.100",
            "microsoft.net.workload.mono.toolchain.net9": "10.0.112/10.0.100"
          }
          EOF
          dotnet workload install maui --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"
          dotnet workload list

      # 3.1 选择与 iOS 工作负载匹配的 Xcode
      #   .NET for iOS 的包会校验 Xcode 版本：iOS 26.5.10318 的包要求 Xcode 26.6，不符时 Build iOS 直接报
      #   "This version of .NET for iOS (26.5.10318) requires Xcode 26.6. The current version of Xcode is 26.5"。
      #   macos-latest 的默认 Xcode 会随镜像升级，所以显式选定（升级工作负载时以构建报错里写明的 Xcode 版本为准）。
      #   用 realpath 取真实路径：若 Xcode_x.y.app 只是符号链接，经链接选择会让 xcodebuild 报 "SDK ... cannot be located"。
      - name: Select Xcode 26.6
        run: |
          XCODE_APP="$(realpath /Applications/Xcode_26.6.app)"
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun -find actool
          xcrun simctl list runtimes

      # 4. 获取当前版本号
      #   手动触发时填的 version / build_number 经 env 传入并校验格式，不再用 ${{ }} 直接拼进脚本文本
      #   （直接拼接等于允许输入框里的内容当作 shell 命令执行；校验通过的值只含数字和点，后面写进 sed 也是安全的）。
      - name: Get current version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          # 从 csproj 读取版本号 (兼容 macOS)
          VERSION=$(sed -n 's/.*<ApplicationDisplayVersion>\(.*\)<\/ApplicationDisplayVersion>.*/\1/p' ${{ env.PROJECT_PATH }})
          BUILD=$(sed -n 's/.*<ApplicationVersion>\(.*\)<\/ApplicationVersion>.*/\1/p' ${{ env.PROJECT_PATH }})

          version_pattern='^[0-9]+(\.[0-9]+){1,3}$'
          number_pattern='^[0-9]+$'

          # 使用输入的版本号或当前版本号（不回显输入内容，避免把未校验的文本写进日志命令）
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ $version_pattern ]]; then
              echo "::error::version 输入格式不对：应为 1.0.0 这样的数字版本号（2~4 段数字，用点分隔）"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          fi

          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            if ! [[ "$INPUT_BUILD_NUMBER" =~ $number_pattern ]]; then
              echo "::error::build_number 输入格式不对：应为正整数"
              exit 1
            fi
            BUILD="$INPUT_BUILD_NUMBER"
          else
            BUILD=$((BUILD + 1))
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD" >> $GITHUB_OUTPUT
          echo "📦 Building version $VERSION (Build $BUILD)"

      # 5. 更新版本号
      - name: Update version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          sed -i '' "s/<ApplicationDisplayVersion>.*<\/ApplicationDisplayVersion>/<ApplicationDisplayVersion>${APP_VERSION}<\/ApplicationDisplayVersion>/" ${{ env.PROJECT_PATH }}
          sed -i '' "s/<ApplicationVersion>.*<\/ApplicationVersion>/<ApplicationVersion>${APP_BUILD_NUMBER}<\/ApplicationVersion>/" ${{ env.PROJECT_PATH }}

      # 6. 安装 Apple 证书和 Provisioning Profile
      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          # 创建临时目录
          mkdir -p ~/Certificates

          # 解码证书
          echo "$APPLE_CERTIFICATE" | base64 --decode > ~/Certificates/certificate.p12

          # 创建钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入证书
          security import ~/Certificates/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # 安装 Provisioning Profile
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # 提取 UUID
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH") 2>/dev/null || \
                 openssl rand -hex 16 | sed 's/\(.\{8\}\)\(.\{4\}\)\(.\{4\}\)\(.\{4\}\)\(.\{12\}\)/\1-\2-\3-\4-\5/')

          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "✅ Installed provisioning profile: $UUID"

      # 7. 还原依赖
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      # 8. 打包 iOS
      #   -p:CloudApiBaseUrl：打出的 App 连哪台云端服务器（仓库不内置线上域名；值经 env 传入，
      #   App 项目文件在 publish 时还会再校验一遍格式，没指定会直接报错）。
      - name: Build iOS
        env:
          CODE_SIGN_KEYSTORE_PASSWORD: ""
          CLOUD_API_BASE_URL: ${{ secrets.CLOUD_API_BASE_URL || vars.CLOUD_API_BASE_URL }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          # -p:PublishAot=false + -p:MtouchInterpreter=all: iOS 发布包默认 Mono 全 AOT 且不启用解释器，
          #   运行时 IsDynamicCodeSupported=false，EF Core 首次访问实体属性时抛出
          #   "Model building is not supported when publishing with NativeAOT. Use a compiled model."
          #   启用解释器恢复动态代码支持（与 csproj 中 iOS 目标设置一致，全局属性为双保险）。
          dotnet publish ${{ env.PROJECT_PATH }} \
            -f net10.0-ios \
            -c Release \
            -o ${{ env.OUTPUT_PATH }} \
            -p:PublishAot=false \
            -p:MtouchInterpreter=all \
            -p:ArchiveOnBuild=true \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CloudApiBaseUrl="$CLOUD_API_BASE_URL" \
            -p:CodesignKey="Apple Distribution" \
            -p:CodesignProvision="$APPLE_PROVISIONING_PROFILE_NAME"

      # 9. 查找 IPA 文件
      - name: Find IPA file
        id: find-ipa
        run: |
          IPA_FILE=$(find ${{ env.OUTPUT_PATH }} -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ IPA file not found!"
            exit 1
          fi
          echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT
          echo "✅ Found IPA: $IPA_FILE"
          ls -lh "$IPA_FILE"

      # 10. 上传到蒲公英
      #   本仓库是公开的，构建日志和 artifact 任何人都能看 / 下载，所以：
      #   - 安装方式：默认公开安装（buildInstallType=1，知道下载页地址的人都能装）。想加密码就建 Secret
      #     PGYER_INSTALL_PASSWORD（可选），设了就改为密码安装（buildInstallType=2）；密码不写进仓库、不打印；
      #   - 下载页地址不打印，到蒲公英后台「应用管理」查看下载页 / 二维码；
      #   - 不再把 IPA 和下载地址当作 artifact 上传（公开仓库的 artifact 任何登录 GitHub 的人都能下载，
      #     而这是带着签名和描述文件的安装包）；
      #   - 纯文本字段用 --form-string 传：-F 会把以 @ 或 < 开头的值当成「读本地文件」，
      #     口令 / Key 恰好以这两个字符开头时，文件内容会被发给对方。
      - name: Upload to Pgyer
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_INSTALL_PASSWORD: ${{ secrets.PGYER_INSTALL_PASSWORD }}
          IPA_PATH: ${{ steps.find-ipa.outputs.ipa_path }}
        run: |
          echo "🚀 Uploading to Pgyer..."

          # 参数放数组里，不拼字符串（与 build/build.sh 一致）
          curl_args=(--form-string "_api_key=$PGYER_API_KEY" -F "file=@$IPA_PATH" --form-string "buildName=记账本")
          if [ -n "$PGYER_INSTALL_PASSWORD" ]; then
            curl_args+=(--form-string "buildInstallType=2" --form-string "buildPassword=$PGYER_INSTALL_PASSWORD")
            echo "🔒 安装方式：密码安装"
          else
            curl_args+=(--form-string "buildInstallType=1")
            echo "🔓 安装方式：公开安装（未设置 PGYER_INSTALL_PASSWORD）"
          fi

          RESPONSE=$(curl -s -X POST "https://www.pgyer.com/apiv2/app/upload" "${curl_args[@]}")

          # 解析响应
          CODE=$(echo "$RESPONSE" | jq -r '.code')
          MESSAGE=$(echo "$RESPONSE" | jq -r '.message')

          if [ "$CODE" = "0" ]; then
            BUILD_VERSION=$(echo "$RESPONSE" | jq -r '.data.buildVersion')

            echo "✅ Upload successful!"
            echo "📱 App Name: 记账本"
            echo "📦 Version: $BUILD_VERSION"
            echo "🔗 下载页与二维码请到蒲公英后台「应用管理」查看（地址不写进公开日志）"
          else
            echo "❌ Upload failed: $MESSAGE"
            exit 1
          fi

      # 11. 清理签名文件
      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/Certificates/certificate.p12
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
